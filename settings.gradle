pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.0.0'
}

rootProject.name = 'cdk-parent'

include 'cdk-shared'
include 'cdk-core'
include 'cdk-test'
include 'cdk-bom'


enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-platform")
}
